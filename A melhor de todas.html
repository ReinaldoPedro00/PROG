<!DOCTYPE html>

<
<html lang="pt">
<head>
    
   
<meta charset="UTF-8">
    
    <

  
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Melhor de Todas</title>
    
    
<style>
     

  

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fef5ff;
            color: #333;
        }
        button {
            background-color: #ff007f;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
        }
        .footer {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>

</
</head>
<body>
    <h1>A Melhor de Todas ❤️ </h1>
    
 
<button onclick="alert('❤️ A Melhor de TODAS ❤️')">❤️ Clique Aqui ❤️</button>
    
   
<div class="footer">Criado por Reinaldo Pedro</div>
</body>

</
</html>
